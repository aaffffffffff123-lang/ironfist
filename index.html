<style>
:root{
  --ink:#1b1a19; --ink2:#5d5a55; --line:#e3dfd8; --paper:#ffffff; --bg:#efece6;
  --hi:#ffcc00; --hi-ink:#1b1a19; --red:#c8261b;
  --font:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);overscroll-behavior:none;word-break:keep-all;-webkit-touch-callout:none}
/* 길게 눌러 모으는 동안 글자 선택·돋보기·메뉴가 뜨지 않게 */
body.playing{-webkit-user-select:none;user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
button{font-family:inherit}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:60;transition:opacity .5s}
#boot .bar{width:140px;height:4px;background:#ddd8cf;border-radius:4px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;background:var(--ink);animation:ld 1s ease-in-out infinite}
@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
body.loaded #boot{opacity:0;pointer-events:none}
#err{display:none;position:fixed;left:16px;right:16px;bottom:16px;padding:12px 14px;background:#fff;border:1px solid #f0c7c2;color:var(--red);border-radius:12px;z-index:70;font-size:14px}

/* 오락실 얼굴 */
#arcadeFace{position:fixed;z-index:46;display:block;width:38px;height:38px;padding:6px;line-height:0;left:calc(6px + env(safe-area-inset-left));top:calc(6px + env(safe-area-inset-top))}
#arcadeFace svg{display:block;width:100%;height:100%;filter:drop-shadow(0 0 1.5px #fff) drop-shadow(1px 2px 1.5px rgba(0,0,0,.35))}
#arcadeFace:active svg{transform:scale(.88)}

/* 소리 */
#sound{position:fixed;z-index:46;right:calc(8px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.82);box-shadow:0 1px 4px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
#sound svg{width:19px;height:19px}
#sound .x{display:none}
#sound.off .w{display:none}
#sound.off .x{display:block}
body.playing #sound{display:none}

/* 제목 */
#title{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:calc(13vh + env(safe-area-inset-top));opacity:0;pointer-events:none;transition:opacity .35s}
#title.show{opacity:1;pointer-events:auto}
#title::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(239,236,230,.92) 0%,rgba(239,236,230,.7) 38%,rgba(239,236,230,0) 70%);pointer-events:none}
.logo{position:relative;font-family:'Noto Sans JP','Noto Sans CJK JP','Yu Gothic',sans-serif;font-size:clamp(64px,min(22vw,18vh),118px);font-weight:900;line-height:1;letter-spacing:.1em;padding-left:.1em;color:var(--ink);margin:0;user-select:none}
.logo span{display:inline-block}
.logo::after{content:'';display:block;height:min(2.2vw,10px);background:var(--hi);margin:min(3vw,14px) 6% 0;border-radius:2px}
.tbtns{position:relative;display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:min(7vh,48px)}
.btn{appearance:none;border:0;border-radius:14px;padding:15px 34px;font-size:18px;font-weight:900;cursor:pointer;background:var(--ink);color:#fff;letter-spacing:-.01em;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.ghost{background:rgba(255,255,255,.8);color:var(--ink2);font-size:14px;font-weight:700;padding:10px 18px;box-shadow:none;border:1px solid var(--line)}
.btn:disabled{opacity:.35;cursor:default}
#ctrlHint{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;font-size:13px;font-weight:700;color:var(--ink);opacity:.75;text-shadow:0 0 6px #fff,0 0 2px #fff}

/* HUD */
#hud{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;transition:opacity .25s}
#hud.show{opacity:1}
/* 참을성 막대 */
#endureBox{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border-radius:999px;padding:8px 12px 8px 13px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
#endureBox .lbl{font-size:13px;font-weight:900;letter-spacing:-.02em;color:var(--ink)}
#endureBox .bar{position:relative;width:96px;height:9px;border-radius:99px;background:#e4dfd6;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.14)}
#endureFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,#6e140d,#c8261b);transition:width .22s ease-out}
#endureBox.full #endureFill{background:linear-gradient(90deg,#c8261b,#ff9c1a);animation:fullPulse 1.1s ease-in-out infinite}
@keyframes fullPulse{50%{filter:brightness(1.25)}}
#endureBox.flash{animation:eflash .45s ease-out}
@keyframes eflash{0%{box-shadow:0 0 0 0 rgba(255,204,0,.9),0 1px 6px rgba(0,0,0,.15)}100%{box-shadow:0 0 0 9px rgba(255,204,0,0),0 1px 6px rgba(0,0,0,.15)}}
#wallName{position:absolute;left:0;right:0;top:calc(18px + env(safe-area-inset-top));text-align:center;font-size:13px;font-weight:700;color:var(--ink);opacity:.6;text-shadow:0 0 6px #fff}
#hint{position:fixed;z-index:31;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(27,26,25,.86);color:#fff;font-size:14px;font-weight:700;padding:10px 16px;border-radius:12px;opacity:0;transition:all .3s;pointer-events:none;max-width:88vw;text-align:center}
#hint.show{opacity:1;transform:translate(-50%,0)}
#hint.top{z-index:60;bottom:auto;top:calc(16px + env(safe-area-inset-top))}

/* 결과·가게 */
#shop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:calc(56px + env(safe-area-inset-top)) 12px 12px;background:rgba(239,236,230,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
#shop.show{opacity:1;visibility:visible;pointer-events:auto}
.sheet{width:100%;max-width:560px;max-height:calc(100vh - 68px - env(safe-area-inset-top));max-height:calc(100dvh - 68px - env(safe-area-inset-top));background:var(--paper);border-radius:22px;box-shadow:0 8px 30px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#shop.show .sheet{transform:none}
.shopBody{padding:20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;min-height:0}
.res{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.res[hidden]{display:none}
.res[hidden]+.opened{margin-top:0}
.res[hidden]~.goal{margin-top:0;border-top:0;padding-top:2px}
.res h2{margin:0;font-size:15px;color:var(--ink2);font-weight:700}
.res .amount{display:flex;align-items:baseline;gap:5px}
#rEarned{font-family:'Black Han Sans',var(--font);font-size:36px;letter-spacing:-.01em;color:#8f1a10}
/* 새 벽·새 손 알림 */
.opened{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px;border-radius:14px;background:#fff7d6;border:1px solid #f0d77a}
.opened[hidden]{display:none}
.opened .sw{flex:0 0 40px;height:46px;border-radius:9px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.opened .ot{display:flex;flex-direction:column;gap:2px;min-width:0}
.opened .ot span{font-size:12px;font-weight:700;color:#8a6a00}
.opened .ot b{font-size:17px;font-weight:900}
.opened .ot b:empty{display:none}
.opened .ot small{font-size:12px;color:var(--ink2)}
/* 다음 목표까지 */
.goal{margin-top:14px;padding:12px 2px 14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.goalHead{display:flex;align-items:baseline;gap:8px;margin-bottom:9px}
.goalHead span{font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.goalHead b{font-size:15px;font-weight:900;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goalHead em{margin-left:auto;font-style:normal;font-size:13px;font-weight:900;font-variant-numeric:tabular-nums;color:#8f1a10;white-space:nowrap}
.goalBar{position:relative;height:12px;border-radius:99px;background:#ece8e1;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
#goalFill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,#6e140d,#c8261b);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.goal.full #goalFill{background:linear-gradient(90deg,#c8261b,#ff9c1a)}
.sec{margin:18px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec h3{margin:0;font-size:17px;font-weight:900}
#sArms.shake{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.arms{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.arm{border:1px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.arm.ready{border-color:#b4c2a1;background:#fafcf6}
.armHead{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.armHead b{font-size:16px}
.armState{font-size:13px;color:var(--ink2)}
.arm.ready .armState{color:#465d28;font-weight:700}
.armBtns{display:flex;flex-direction:column;gap:8px}
.btn.sub{padding:11px 6px;font-size:13px;border-radius:10px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;background:var(--hi);color:var(--ink);box-shadow:none;font-weight:900;min-height:58px;width:100%;letter-spacing:0}
.btn.sub em{font-style:normal;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.btn.sub:not(:disabled):active{background:#edbd00}
.btn.sub:disabled{opacity:1;background:#f0eee9;color:#99958c}
.armReady{min-height:58px;display:flex;align-items:center;justify-content:center;border-radius:10px;background:#eaf0e2;color:#465d28;font-size:13px;font-weight:700}
.wallPicker{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.wallPicker summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:36px}
.wallPicker summary::-webkit-details-marker{display:none}
.wallPicker summary::after{content:'변경 ▾';font-size:12px;color:var(--ink2);white-space:nowrap;margin-left:auto}
.wallPicker[open] summary::after{content:'접기 ▴'}
.wallPicker summary>span{display:flex;flex-direction:column;gap:3px}
.wallPicker summary b{font-size:14px}
.wallPicker summary small{font-size:12px;color:var(--ink2)}
.walls{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.wall{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;color:var(--ink);font-family:inherit}
.wall.cur{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.wall:disabled{cursor:default}
.wall.locked{opacity:.55}
.wall .sw{flex:0 0 36px;height:42px;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.wall .wt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.wall .wt b{font-size:14px}
.wall .wt small{font-size:11px;color:var(--ink2);line-height:1.4}
.wall .wt .sk{font-size:12px;font-weight:900;color:#9a5b00;letter-spacing:-.01em}
.wall.locked .wp em{background:#ece9e2;color:#99958c}
.wall .wp{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;max-width:98px}
.wall .wp em{font-style:normal;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums;background:var(--hi);color:var(--hi-ink);padding:3px 6px;border-radius:7px}
.wall .wp i{font-style:normal;font-weight:900;font-size:12px}
.wall .wp i.o{color:var(--ink2)}
.wall .wp small{font-size:10px;color:var(--ink2)}
.next{flex-shrink:0;position:relative;padding:12px 20px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:8px}
.next .btn{width:100%;font-size:17px;padding:15px 8px}
#nextNote{font-size:12px;color:var(--ink2);font-weight:500;line-height:1.5;text-align:center}
#nextNote:empty{display:none}
/* 좁은 화면: 벽 이름을 참을성 막대 아래 줄로 */
@media (max-width:560px){#wallName{top:calc(56px + env(safe-area-inset-top))}}
@media (max-width:380px){.shopBody{padding:16px 12px}.next{padding-left:12px;padding-right:12px}.arm{padding:10px 7px}.wall .sw{display:none}#endureBox .bar{width:78px}}
</style>

<button id="sound" aria-label="소리 켜기/끄기">
  <svg class="w" viewBox="0 0 24 24" fill="none" stroke="#1b1a19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1b1a19"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
  <svg class="x" viewBox="0 0 24 24" fill="none" stroke="#1b1a19" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="#1b1a19"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
</button>

<section id="title" aria-hidden="true" inert>
  <h1 class="logo"><img src="title-logo.webp?v=forge1" alt="鉄拳" width="1400" height="700" draggable="false" fetchpriority="high"></h1>
  <div class="tbtns">
    <button class="btn" id="btnStart">시작</button>
    <button class="btn ghost" id="btnNew">처음부터</button>
  </div>
  <div id="ctrlHint"></div>
</section>

<div id="hud">
  <div id="wallName"></div>
  <div id="endureBox" role="progressbar" aria-label="참을성" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="lbl">참을성</span><span class="bar"><i id="endureFill"></i></span></div>
</div>
<div id="hint"></div>

<section id="shop" role="dialog" aria-modal="true" aria-labelledby="shopTitle" aria-hidden="true" inert>
  <div class="sheet">
    <div class="shopBody">
      <div class="res"><h2 id="shopTitle">이번 판 참을성</h2><span class="amount"><span id="rEarned">+0</span></span></div>
      <div class="opened" id="opened" hidden><span class="sw" id="openedSw"></span><span class="ot"><span id="openedTitle"></span><b id="openedName"></b><small id="openedNote"></small></span></div>
      <div class="goal" id="goal">
        <div class="goalHead"><span id="goalLabel">다음 벽</span><b id="goalName"></b><em id="goalLeft"></em></div>
        <div class="goalBar"><i id="goalFill"></i></div>
      </div>
      <div class="sec"><h3>다음 판 준비</h3></div>
      <div class="arms" id="sArms"></div>
      <details class="wallPicker" id="wallPicker">
        <summary><span><b id="sWallName">시멘트 벽</b><small id="sWallMult"></small></span></summary>
        <div class="walls" id="sWalls"></div>
      </details>
    </div>
    <div class="next"><span id="nextNote" aria-live="polite"></span><button class="btn" id="btnNext" disabled>철권을 장착하세요</button></div>
  </div>
</section>
